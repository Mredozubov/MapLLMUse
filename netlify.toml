# --- Netlify dashboard (Site settings → Build & deploy) -----------------------
# Base directory: leave EMPTY (repository root). Do not set "main" — that is a branch name,
# not a folder; Netlify would look for ./main and the build would fail.
# Publish directory: use frontend/dist (this file sets it). Do NOT use dist/client — this app
# is plain Vite; output is frontend/dist, not an SSR client bundle.
# Build command: npm run build (root package.json) or the command below — avoid a UI command
# that only runs `vite build` from repo root without cd/npm --prefix frontend.
# ------------------------------------------------------------------------------
# Run `netlify dev` ONLY from the repository root.
# Python: venv with `pip install -r backend/requirements.txt` (activate before `netlify dev`).
# Frontend: `frontend/` (Vite). Functions: `netlify/functions/`.
#
# Long scans: Netlify CLI caps synchronous functions at 30s when the site is unlinked (lambda-local).
# Use the app at http://localhost:5173 while Vite runs — the dev server inlines `/.netlify/functions/scan`
# in Node (see frontend/vite.config.ts). Or `netlify link` and raise the site's function timeout in the UI.
[dev]
  command = "npm --prefix frontend run dev"
  targetPort = 5173

[build]
  publish = "frontend/dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/script.py"]

# Allow long-running scans (large repos). Netlify caps by plan; dev CLI reads this on recent versions.
[functions.scan]
  timeout = 900

[[redirects]]
  from = "/data/index.html"
  to = "/Data/index.html"
  status = 301
  force = true
