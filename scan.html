<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLLMUse · Scanner</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --bg-elevated: #151528;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f2f6;
      --muted: #9ca3c7;
      --accent: #e74c3c;
      --accent-hover: #ff5e4d;
      --card: #12122a;
      --high: #e74c3c;
      --medium: #f39c12;
      --low: #27ae60;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header.scan-header {
      text-align: center;
      margin-bottom: 28px;
    }

    header.scan-header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    header.scan-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .scan-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: stretch;
      justify-content: center;
      max-width: 720px;
      margin: 0 auto 28px;
    }

    .scan-bar input {
      flex: 1 1 220px;
      min-width: 0;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .scan-bar input::placeholder {
      color: #6b7280;
    }

    .scan-bar input:focus {
      border-color: rgba(231, 76, 60, 0.55);
      box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
    }

    .scan-bar button {
      flex: 0 0 auto;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .scan-bar button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .scan-bar button:active:not(:disabled) {
      transform: scale(0.98);
    }

    .scan-bar button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 40px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: none;
    }

    .spinner.visible {
      display: block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-banner {
      display: none;
      max-width: 720px;
      margin: 0 auto 20px;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.35);
      color: #fecaca;
      font-size: 0.95rem;
    }

    .error-banner.visible {
      display: block;
    }

    .results {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .results.visible {
      display: grid;
    }

    @media (max-width: 900px) {
      .results.visible {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      margin: 0;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
    }

    .card-body {
      padding: 0;
    }

    .table-wrap {
      max-height: min(55vh, 480px);
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #1a1a36;
      z-index: 1;
      text-align: left;
      padding: 12px 16px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:nth-child(odd) {
      background: rgba(255, 255, 255, 0.02);
    }

    tbody td {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }

    tbody td:last-child {
      text-align: right;
    }

    .risk-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .risk-pill.high {
      background: rgba(231, 76, 60, 0.2);
      color: #ffb4a8;
    }

    .risk-pill.medium {
      background: rgba(243, 156, 18, 0.2);
      color: #fcd34d;
    }

    .risk-pill.low {
      background: rgba(39, 174, 96, 0.2);
      color: #86efac;
    }

    .ai-body {
      margin: 0;
      padding: 20px;
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 0.98rem;
      line-height: 1.65;
      color: #e5e7eb;
      border-left: 4px solid #8b5cf6;
      margin: 16px;
      border-radius: 0 12px 12px 0;
      background: rgba(139, 92, 246, 0.08);
    }

    .target-note {
      font-size: 0.85rem;
      color: var(--muted);
      padding: 0 20px 16px;
      word-break: break-all;
    }

    footer.site-foot {
      text-align: center;
      padding: 32px 16px;
      color: #6b7280;
      font-size: 0.85rem;
    }

    footer.site-foot a {
      color: var(--accent);
      text-decoration: none;
    }

    footer.site-foot a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="scan-header">
      <h1>MapLLMUse security scanner</h1>
      <p>Enter a GitHub repository or site URL, then run a live pattern scan with AI summary.</p>
    </header>

    <form class="scan-bar" id="scanForm" autocomplete="off">
      <input
        type="text"
        id="targetInput"
        name="target"
        placeholder="https://github.com/owner/repo"
        inputmode="url"
        aria-label="Repository or website URL"
      />
      <button type="submit" id="scanBtn">Scan</button>
    </form>

    <div class="status-row" id="statusRow" aria-live="polite">
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <span id="statusText"></span>
    </div>

    <div class="error-banner" id="errorBanner" role="alert"></div>

    <section class="results" id="results" aria-live="polite">
      <article class="card">
        <h2>Pattern matches</h2>
        <p class="target-note" id="targetNote"></p>
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Vulnerability</th>
                  <th style="text-align: right">Score</th>
                  <th style="text-align: right">Risk level</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </article>

      <article class="card">
        <h2>🤖 AI Executive Summary</h2>
        <div class="card-body">
          <p class="ai-body" id="aiSummary"></p>
        </div>
      </article>
    </section>
  </div>

  <footer class="site-foot">
    <a href="/index.html">Marketing site</a>
    ·
    <a href="/Data/index.html">Last saved HTML report</a>
  </footer>

  <script>
    (function () {
      const form = document.getElementById("scanForm");
      const input = document.getElementById("targetInput");
      const btn = document.getElementById("scanBtn");
      const spinner = document.getElementById("spinner");
      const statusText = document.getElementById("statusText");
      const errorBanner = document.getElementById("errorBanner");
      const results = document.getElementById("results");
      const tableBody = document.getElementById("tableBody");
      const aiSummary = document.getElementById("aiSummary");
      const targetNote = document.getElementById("targetNote");

      const SCAN_URL = "/.netlify/functions/scan";

      function setLoading(on) {
        btn.disabled = on;
        spinner.classList.toggle("visible", on);
        statusText.textContent = on ? "Scanning repository… this can take a minute." : "";
      }

      function showError(msg) {
        errorBanner.textContent = msg;
        errorBanner.classList.add("visible");
      }

      function clearError() {
        errorBanner.textContent = "";
        errorBanner.classList.remove("visible");
      }

      function riskClass(level) {
        var l = (level || "").toLowerCase();
        if (l === "high") return "high";
        if (l === "medium") return "medium";
        return "low";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearError();
        results.classList.remove("visible");

        var target = input.value.trim();
        if (!target) {
          showError("Please enter a URL or GitHub repo.");
          return;
        }

        setLoading(true);

        fetch(SCAN_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ target: target }),
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok, status: res.status, data: data };
            });
          })
          .then(function (out) {
            setLoading(false);
            if (!out.ok || !out.data.ok) {
              var err = (out.data && out.data.error) || "Request failed (" + out.status + ").";
              showError(err);
              return;
            }
            var d = out.data;
            targetNote.textContent = "Target: " + d.target;
            tableBody.innerHTML = "";
            (d.vulnerabilities || []).forEach(function (row) {
              var tr = document.createElement("tr");
              var pillClass = "risk-pill " + riskClass(row.riskLevel);
              tr.innerHTML =
                "<td>" +
                escapeHtml(String(row.name)) +
                '</td><td style="text-align:right;font-variant-numeric:tabular-nums">' +
                escapeHtml(String(row.score)) +
                "</td><td><span class=\"" +
                pillClass +
                "\">" +
                escapeHtml(String(row.riskLevel || "Low")) +
                "</span></td>";
              tableBody.appendChild(tr);
            });
            if (!d.vulnerabilities || d.vulnerabilities.length === 0) {
              var empty = document.createElement("tr");
              empty.innerHTML =
                '<td colspan="3" style="padding:20px;color:#9ca3c7">No pattern rows returned.</td>';
              tableBody.appendChild(empty);
            }
            aiSummary.textContent = d.aiSummary || "";
            results.classList.add("visible");
          })
          .catch(function () {
            setLoading(false);
            showError("Network error. If you opened this file locally, use a dev server or deploy to Netlify.");
          });
      });

      function escapeHtml(s) {
        var div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
